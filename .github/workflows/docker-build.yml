# ==============================================================================
# CareerGenie — Docker Build & Push CI
# ==============================================================================
# Builds the Next.js application as a Docker image and pushes it to Docker Hub.
# Triggered on every push to main and manually via workflow_dispatch.
#
# GitHub repository secrets:
#   DOCKERHUB_USERNAME                  — Docker Hub username
#   DOCKERHUB_TOKEN                     — Docker Hub access token (not password)
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY   — Clerk publishable key for Next.js build
# Note: Docker Hub secrets are optional for build-only runs. Image push is skipped
# when they are not configured.
# ==============================================================================

name: Docker Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ajay200590/careergenie

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout the repository
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Generate image metadata (tags + labels)
      # ---------------------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=sha,format=long

      # ---------------------------------------------------------------
      # 3. Set up Docker Buildx (required for advanced build features)
      # ---------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------------
      # 4. Authenticate with Docker Hub
      # ---------------------------------------------------------------
      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB_CREDS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub push disabled
        if: env.HAS_DOCKERHUB_CREDS != 'true'
        run: echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not configured; skipping image push."

      # ---------------------------------------------------------------
      # 5. Build and push the Docker image
      # ---------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.HAS_DOCKERHUB_CREDS == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
